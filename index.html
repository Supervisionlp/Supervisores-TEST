            throw new Error("TEST_35D: pruebas_realizadas no pertenece al guardado genérico.");
        if (JSON.stringify(next.codigos || []) !== JSON.stringify(prev?.codigos || []))
            throw new Error("TEST_35D: no se modifica el catálogo de códigos.");

        const previousHelpers = new Map((prev?.ayudantes || []).map(a => [a.id, a]));

            a.localId !== previousHelpers.get(a.id).localId))
            throw new Error("Alta o ubicación de ayudantes fuera del flujo autorizado.");

        const previousVisits = new Map((prev?.visitas || []).map(v => [v.id, v]));
        if ((next.visitas || []).some(v => !previousVisits.has(v.id) ||
            JSON.stringify(v) !== JSON.stringify(previousVisits.get(v.id))) ||
            (prev?.visitas || []).some(v => !(next.visitas || []).some(n => n.id === v.id))) {
            assertTestWriteAllowed("visitas");
        }
        for (const campo of ["rutas", "tareas"]) {
            if (JSON.stringify(next[campo] || []) !== JSON.stringify(prev?.[campo] || []))
                throw new Error("El guardado genérico no admite cambios de " + campo + ".");
        }
        for (const campo of ["precioCombustible", "localesInactivos", "observacionesPendientes", "historialObservaciones"]) {
            if (JSON.stringify(next[campo]) !== JSON.stringify(prev?.[campo]))
                throw new Error("Este cambio requiere su RPC TEST_35G; no pertenece al guardado genérico.");
        }
        const promises = [];
        if (JSON.stringify(next.ayudantes || []) !== JSON.stringify(prev?.ayudantes || []))
            throw new Error("Los cambios de ayudantes requieren su contrato especifico y recarga canonica.");

        const fallo = resultados.find(r => r.status === "rejected");

        console.error("saveData:", err);
